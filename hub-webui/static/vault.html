<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Vault — AI Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ── Layout ─────────────────────────────────────────────────── */
    body { overflow: hidden; }
    #tool-wrap { display:flex; flex-direction:column; height:100vh; }

    #tool-header {
      display:flex; align-items:center; gap:12px;
      padding:0 16px; height:52px; flex-shrink:0;
      background:var(--bg-card); border-bottom:1px solid var(--border);
    }
    .back-btn {
      background:none; border:1px solid var(--border); color:var(--text-secondary);
      border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer;
      transition:color .15s, border-color .15s;
    }
    .back-btn:hover { color:var(--text-primary); border-color:var(--accent-purple); }
    #tool-header h1 { font-size:15px; font-weight:600; color:var(--text-primary); }

    #search-box {
      flex:1; max-width:340px; background:var(--bg-input);
      border:1px solid var(--border); color:var(--text-primary);
      border-radius:6px; padding:6px 12px; font-size:13px; font-family:inherit;
    }
    #search-box:focus { outline:none; border-color:var(--accent-purple); }

    #sort-select {
      background:var(--bg-input); border:1px solid var(--border);
      color:var(--text-secondary); border-radius:6px; padding:5px 9px;
      font-size:12px; font-family:inherit;
    }

    #model-count { font-size:12px; color:var(--text-dim); }

    /* ── Cuerpo: sidebar + grid ─────────────────────────────────── */
    #vault-body { display:flex; flex:1; overflow:hidden; }

    #sidebar {
      width:150px; flex-shrink:0; border-right:1px solid var(--border);
      overflow-y:auto; padding:10px 8px;
      display:flex; flex-direction:column; gap:2px;
    }
    .sidebar-title {
      font-size:10px; font-weight:600; color:var(--text-dim);
      text-transform:uppercase; letter-spacing:.06em;
      padding:0 8px; margin-bottom:4px; margin-top:6px;
    }
    .cat-btn {
      background:none; border:none; width:100%; text-align:left;
      color:var(--text-secondary); font-size:12px; padding:6px 10px;
      border-radius:6px; cursor:pointer; transition:background .1s, color .1s;
      display:flex; align-items:center; justify-content:space-between;
    }
    .cat-btn:hover  { background:rgba(255,255,255,.05); color:var(--text-primary); }
    .cat-btn.active { background:rgba(96,13,181,.2); color:var(--accent-cyan); }
    .cat-count {
      font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;
    }
    .cat-btn.active .cat-count { color:var(--accent-purple); }

    /* ── Grid de modelos ────────────────────────────────────────── */
    #main-area { flex:1; display:flex; overflow:hidden; }

    #grid-wrap { flex:1; overflow-y:auto; padding:12px; }
    #model-grid {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap:10px;
    }

    /* Tarjeta de modelo */
    .model-card {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:8px; overflow:hidden; cursor:pointer;
      transition:border-color .15s, transform .1s;
    }
    .model-card:hover { border-color:var(--accent-purple); transform:translateY(-1px); }
    .model-card.selected { border-color:var(--accent-cyan); }

    .model-thumb {
      width:100%; aspect-ratio:4/5; object-fit:cover;
      background:var(--bg-input); display:block;
    }
    .model-thumb-placeholder {
      width:100%; aspect-ratio:4/5;
      background:linear-gradient(135deg, rgba(96,13,181,.15), rgba(84,239,234,.08));
      display:flex; align-items:center; justify-content:center;
      font-size:28px; color:rgba(255,255,255,.12);
    }
    .model-card-body { padding:8px; }
    .model-card-name {
      font-size:12px; font-weight:500; color:var(--text-primary);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .model-card-meta { font-size:10px; color:var(--text-secondary); margin-top:3px; }
    .model-type-badge {
      display:inline-block; font-size:9px; padding:1px 5px; border-radius:3px;
      background:rgba(255,255,255,.06); color:var(--text-secondary);
      text-transform:uppercase; font-weight:600; letter-spacing:.04em;
    }

    /* ── Panel de detalles (desliza desde la derecha) ───────────── */
    #details-panel {
      width:0; flex-shrink:0; overflow:hidden;
      transition:width .2s ease; border-left:1px solid transparent;
      display:flex; flex-direction:column;
    }
    #details-panel.open {
      width:320px; border-left-color:var(--border);
    }
    #details-inner {
      width:320px; overflow-y:auto; padding:14px; height:100%;
    }

    #details-close {
      background:none; border:none; color:var(--text-secondary);
      cursor:pointer; font-size:16px; float:right; padding:0;
      transition:color .1s;
    }
    #details-close:hover { color:var(--text-primary); }

    .detail-thumb {
      width:100%; border-radius:6px; margin-bottom:12px;
      max-height:260px; object-fit:cover;
    }
    .detail-name {
      font-size:14px; font-weight:600; color:var(--text-primary); margin-bottom:8px;
    }
    .detail-row {
      display:flex; gap:6px; margin-bottom:6px; align-items:baseline;
    }
    .detail-lbl { font-size:11px; color:var(--text-dim); width:72px; flex-shrink:0; }
    .detail-val { font-size:12px; color:var(--text-primary); flex:1; word-break:break-word; }

    .detail-section-title {
      font-size:10px; font-weight:600; color:var(--text-dim);
      text-transform:uppercase; letter-spacing:.06em;
      margin:14px 0 6px;
    }

    .trigger-chip {
      display:inline-block; background:rgba(84,239,234,.1);
      color:var(--accent-cyan); font-size:11px; padding:2px 7px;
      border-radius:4px; margin:2px 2px 2px 0; cursor:default;
    }
    .civitai-tag-chip {
      display:inline-block; background:rgba(96,13,181,.2);
      color:var(--accent-purple); font-size:11px; padding:2px 7px;
      border-radius:4px; margin:2px 2px 2px 0; cursor:default;
    }

    #detail-notes {
      width:100%; height:80px; resize:vertical;
      background:var(--bg-input); border:1px solid var(--border);
      color:var(--text-primary); border-radius:6px; padding:7px;
      font-size:12px; font-family:inherit; margin-top:4px;
    }
    #detail-notes:focus { outline:none; border-color:var(--accent-purple); }

    #detail-tags {
      width:100%; background:var(--bg-input); border:1px solid var(--border);
      color:var(--text-primary); border-radius:6px; padding:6px 9px;
      font-size:12px; font-family:inherit; margin-top:4px;
    }

    /* Progress de scan */
    #scan-progress {
      display:none; position:fixed; top:52px; left:0; right:0; z-index:50;
      padding:6px 16px; background:rgba(9,2,27,.95);
      border-bottom:1px solid var(--border);
      align-items:center; gap:10px; font-size:12px;
    }
    #scan-progress.visible { display:flex; }
    #scan-bar-track {
      flex:1; height:4px; background:rgba(255,255,255,.07); border-radius:2px;
    }
    #scan-bar-fill {
      height:100%; width:0%; border-radius:2px;
      background:linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
      transition:width .1s;
    }
    #scan-label { color:var(--text-secondary); white-space:nowrap; overflow:hidden;
                   text-overflow:ellipsis; max-width:300px; }

    /* Empty state */
    .grid-empty {
      grid-column:1/-1; padding:40px 0; text-align:center;
      color:var(--text-dim); font-size:13px;
    }
    .grid-empty .big-icon { font-size:36px; display:block; margin-bottom:10px; opacity:.4; }
  </style>
</head>
<body>
<div id="tool-wrap">

  <!-- Header -->
  <header id="tool-header">
    <button class="back-btn" onclick="location.href='/'" data-i18n="vault.back">← AI Hub</button>
    <h1>📦 Model Vault</h1>
    <input type="text" id="search-box" data-i18n-placeholder="vault.search_placeholder" placeholder="Buscar por nombre, arch, creador, tags...">
    <select id="sort-select">
      <option value="recent" data-i18n="vault.sort_recent">Más recientes</option>
      <option value="name" data-i18n="vault.sort_name">A–Z</option>
      <option value="arch" data-i18n="vault.sort_arch">Arquitectura</option>
    </select>
    <span id="model-count">—</span>
    <div class="spacer"></div>
    <button class="btn btn-outline" id="btn-civitai-sync" data-i18n="vault.btn_sync_civitai" data-i18n-title="vault.btn_sync_civitai">☁ Sync Civitai</button>
    <button class="btn btn-outline" id="btn-civitai-force" data-i18n="vault.btn_resync_all" data-i18n-title="vault.btn_resync_all">☁ Re-sync Todo</button>
    <button class="btn btn-outline" id="btn-scan" data-i18n="vault.btn_scan">↻ Sincronizar</button>
    <button class="btn btn-outline" data-i18n-lang-btn style="font-size:11px;padding:3px 9px">EN</button>
  </header>

  <!-- Barra de progreso de scan (oculta por defecto) -->
  <div id="scan-progress">
    <span style="color:var(--accent-cyan);flex-shrink:0" data-i18n="vault.scanning">Escaneando</span>
    <div id="scan-bar-track"><div id="scan-bar-fill"></div></div>
    <span id="scan-label">...</span>
    <span id="scan-fraction" style="color:var(--text-dim);flex-shrink:0;font-family:'JetBrains Mono',monospace"></span>
  </div>

  <!-- Cuerpo -->
  <div id="vault-body">

    <!-- Sidebar categorías -->
    <nav id="sidebar">
      <div class="sidebar-title" data-i18n="vault.sidebar_type">Tipo</div>
      <button class="cat-btn active" data-cat="all">
        <span data-i18n="vault.cat_all">Todos</span> <span class="cat-count" id="cnt-all">0</span>
      </button>
      <button class="cat-btn" data-cat="checkpoint">
        <span data-i18n="vault.cat_checkpoint">Checkpoint</span> <span class="cat-count" id="cnt-checkpoint">0</span>
      </button>
      <button class="cat-btn" data-cat="lora">
        <span data-i18n="vault.cat_lora">LoRA</span> <span class="cat-count" id="cnt-lora">0</span>
      </button>
      <button class="cat-btn" data-cat="locon">
        <span data-i18n="vault.cat_lycoris">LyCORIS</span> <span class="cat-count" id="cnt-locon">0</span>
      </button>
      <button class="cat-btn" data-cat="textualinversion">
        <span data-i18n="vault.cat_embedding">Embedding</span> <span class="cat-count" id="cnt-textualinversion">0</span>
      </button>
      <button class="cat-btn" data-cat="vae">
        <span data-i18n="vault.cat_vae">VAE</span> <span class="cat-count" id="cnt-vae">0</span>
      </button>
      <button class="cat-btn" data-cat="upscaler">
        <span data-i18n="vault.cat_upscaler">Upscaler</span> <span class="cat-count" id="cnt-upscaler">0</span>
      </button>
    </nav>

    <!-- Área principal: grid + detalles -->
    <div id="main-area">
      <div id="grid-wrap">
        <div id="model-grid">
          <div class="grid-empty">
            <span class="big-icon">📦</span>
            Cargando modelos...
          </div>
        </div>
      </div>

      <!-- Panel detalles -->
      <div id="details-panel">
        <div id="details-inner">
          <button id="details-close" onclick="closeDetails()">✕</button>
          <div id="details-content"></div>
        </div>
      </div>
    </div>

  </div><!-- #vault-body -->
</div><!-- #tool-wrap -->

<!-- Toast -->
<div id="toast"></div>

<script src="/static/locale.js"></script>
<script src="/static/vault.js"></script>
</body>
</html>
